# Wardence traffic generator -- runs continuously in sock-shop so
# metrics/logs stay alive for the replay viewer (P4) and the future
# DL detector (P5) has real "normal" traffic to learn from.
#
# Uses the official grafana/k6 image (no custom image build needed,
# consistent with the project's off-the-shelf-pieces approach) with
# the scripts mounted from a ConfigMap.
#
# The ConfigMap is NOT defined here as inline YAML -- baseline.js/
# burst.js/run.sh stay the source of truth as plain files, and the
# ConfigMap is generated straight from them so it can never drift out
# of sync. Create/refresh it with:
#   kubectl create configmap wardence-traffic-gen-scripts \
#     -n sock-shop \
#     --from-file=baseline.js=traffic_gen/baseline.js \
#     --from-file=burst.js=traffic_gen/burst.js \
#     --from-file=run.sh=traffic_gen/run.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
# Then apply this file for the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardence-traffic-gen
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wardence-traffic-gen
  template:
    metadata:
      labels:
        app: wardence-traffic-gen
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["/bin/sh", "/scripts/run.sh"]
          env:
            - name: TARGET_URL
              value: "http://front-end.sock-shop.svc.cluster.local"
            # Request-synced GC trigger design (2026-08-22 session): lets
            # baseline.js pause just its own checkout step during a live
            # memory-leak episode. Real, confirmed gap, not yet closed:
            # operator_api.py runs as a bare `uvicorn` process on the WSL
            # host (see its own module docstring), NOT as a cluster
            # Service inside sock-shop -- and its usual launch command has
            # no `--host 0.0.0.0`, so by default it's bound to loopback
            # only and genuinely unreachable from any pod today, cluster-
            # DNS or otherwise. Left empty deliberately -- baseline.js
            # fails open when this is unset (checkout keeps firing
            # normally, unchanged from before this feature existed).
            # Real next step before this can work at all: confirm
            # operator_api.py is launched with --host 0.0.0.0, then fill
            # this in with the WSL2 node's real IP as seen from inside a
            # pod (e.g. `kubectl exec` a shell in sock-shop and curl the
            # candidate IP:8002/trust, which needs no auth) -- not guessed
            # here, since it depends on this machine's real network
            # topology at the time this is deployed.
            # Real value confirmed reachable from inside a sock-shop pod,
            # 2026-08-22 (wget from front-end -> 200 {"paused":false}) --
            # this is the WSL2 node's own eth0 IP, where operator_api.py
            # runs as a bare uvicorn process (--host 0.0.0.0 required, see
            # the comment block above). NOT durable: this IP is assigned
            # by WSL2 on each restart of the WSL2 instance and can change
            # -- if traffic_gen's checkout-pause stops working after a
            # reboot, re-verify with the same wget check before assuming a
            # code regression.
            - name: OPERATOR_API_URL
              value: "http://172.24.242.120:8002"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95)"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: wardence-traffic-gen-scripts
            defaultMode: 0755
