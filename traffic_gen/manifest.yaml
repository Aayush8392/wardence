# Wardence traffic generator -- runs continuously in sock-shop so
# metrics/logs stay alive for the replay viewer (P4) and the future
# DL detector (P5) has real "normal" traffic to learn from.
#
# Uses the official grafana/k6 image (no custom image build needed,
# consistent with the project's off-the-shelf-pieces approach) with
# the scripts mounted from a ConfigMap.
#
# The ConfigMap is NOT defined here as inline YAML -- baseline.js/
# burst.js/run.sh stay the source of truth as plain files, and the
# ConfigMap is generated straight from them so it can never drift out
# of sync. Create/refresh it with:
#   kubectl create configmap wardence-traffic-gen-scripts \
#     -n sock-shop \
#     --from-file=baseline.js=traffic_gen/baseline.js \
#     --from-file=burst.js=traffic_gen/burst.js \
#     --from-file=run.sh=traffic_gen/run.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
# Then apply this file for the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardence-traffic-gen
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wardence-traffic-gen
  template:
    metadata:
      labels:
        app: wardence-traffic-gen
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["/bin/sh", "/scripts/run.sh"]
          env:
            - name: TARGET_URL
              value: "http://front-end.sock-shop.svc.cluster.local"
            # Request-synced GC trigger design (2026-08-22 session): lets
            # baseline.js pause just its own checkout step during a live
            # memory-leak episode. operator_api.py runs as a bare `uvicorn`
            # process on the SAME NODE this pod is scheduled on (WSL2's
            # node locally, the Oracle A1 VM on wardence-prod) -- never as
            # a cluster Service, so there is no in-cluster DNS name for it
            # in either environment. REQUIRES operator_api.py bound to
            # `--host 0.0.0.0` (not the loopback-only default) in whichever
            # environment this runs against, or the pod genuinely cannot
            # reach it -- baseline.js fails open when unreachable (checkout
            # keeps firing normally), so this degrades silently, not loudly.
            #
            # Fixed 2026-08-2x (superseding the old hardcoded-WSL2-IP
            # version, `172.24.242.120`, confirmed non-durable across a
            # WSL2 restart): resolved dynamically via the Downward API's
            # `status.hostIP`, which is always the real IP of whichever
            # node the pod lands on. On a single-node cluster (true for
            # both WSL2 dev and wardence-prod today) that node IS the same
            # host operator_api.py runs on -- so this needs no per-
            # environment value and survives a WSL2 IP reassignment or a
            # move to different hardware, as long as the cluster stays
            # single-node. If this cluster is ever made multi-node, this
            # stops being correct (the traffic-gen pod could land on a
            # DIFFERENT node than operator_api.py) and needs revisiting.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OPERATOR_API_URL
              value: "http://$(HOST_IP):8002"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95)"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: wardence-traffic-gen-scripts
            defaultMode: 0755
