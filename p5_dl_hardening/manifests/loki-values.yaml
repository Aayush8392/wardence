# Loki, single-binary mode, filesystem storage — sized for this project's disposable local lab.
# Deployed via the official grafana/loki Helm chart, same pattern as kube-prometheus-stack.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 48h
    reject_old_samples: true
    reject_old_samples_max_age: 168h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      cpu: 300m
      # Bumped 400Mi -> 1Gi (2026-07-28) -- the original 400Mi was too
      # tight for scanning real accumulated chunk data across the full
      # 48h retention window: repeated OOMKills confirmed (pod restart
      # count climbing, readiness-probe failures across its whole
      # uptime) even for a lightweight count_over_time aggregate query,
      # not just raw-line pagination -- the cost is scanning/decompressing
      # chunks server-side, independent of query shape. Real headroom
      # checked before choosing this number (not guessed): node has
      # 4.5Gi real `available` memory, cluster-wide pod memory LIMITS
      # only total 5320Mi (53% of the 9.7Gi node) before this change --
      # comfortable room for the +624Mi. Paired with chunking the query
      # window client-side (check_loki_log_volume.py) so the real peak
      # memory NEED per request also drops, not just the ceiling.
      memory: 1Gi
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path

# Disable the extra components the chart enables by default that this lab doesn't need.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

test:
  enabled: false
lokiCanary:
  enabled: false
