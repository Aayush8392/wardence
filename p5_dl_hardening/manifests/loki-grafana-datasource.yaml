# Registers Loki as a Grafana datasource, picked up automatically by the
# kube-prometheus-stack Grafana's sidecar (which already watches for ConfigMaps
# labeled grafana_datasource=1 -- same mechanism that wired up Prometheus itself).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: true
