# Blast-radius cage for the Wardence agent.
# Scoped to the sock-shop namespace only. No delete, no exec, no create —
# anywhere. If a fix action isn't achievable with get/list/patch/scale,
# it isn't a fix action this agent is allowed to have.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: wardence-agent
  namespace: sock-shop

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wardence-agent-role
  namespace: sock-shop
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Scoped narrowly to the resize subresource only (2026-07-28, for
  # patch_cpu_limit's in-place resize) -- deliberately NOT a general
  # "pods" patch grant, which would let the agent patch arbitrary pod
  # fields far beyond resource limits. Consistent with the cage's
  # existing minimal-privilege principle: every verb here maps to
  # exactly one real fix action, nothing broader.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "patch"]
  # Scoped narrowly to the carts Service only (2026-08-1x, crash-loop
  # warm-standby demo-visibility fix -- see
  # wardence_crash_loop_warm_standby_LOCKED_SPEC.md). Real, deliberate
  # tightening from what used to be here: this line previously granted
  # unscoped services get/list/patch across the whole namespace, but a
  # direct check confirmed NOTHING in the codebase actually used it --
  # narrowed to exactly the one real, concrete use case (flipping
  # carts's Service selector between carts/carts-warm) rather than
  # leaving a broad, unexercised grant sitting in the cage. `list`
  # dropped deliberately: Kubernetes RBAC's resourceNames restriction
  # has no real effect on `list` (a list request has no single target
  # name to check against), so keeping it would be a silent, meaningless
  # grant; only `get`/`patch` are real here, both correctly scoped.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
    resourceNames: ["carts"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wardence-agent-binding
  namespace: sock-shop
subjects:
  - kind: ServiceAccount
    name: wardence-agent
    namespace: sock-shop
roleRef:
  kind: Role
  name: wardence-agent-role
  apiGroup: rbac.authorization.k8s.io
